<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Care in Action | Community care impact summary</title>
  <link rel="icon" type="image/svg+xml" href="assets/cie-logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  
  <!-- APP SHELL -->
  <div id="app-shell">

    <header class="app-header" role="banner">
      <div class="header-inner">
        <span class="app-logo">
          <img src="assets/cie-logo.png" alt="Care in Action mark">
        </span>
        <span class="app-title">Care in Action</span>
        <span class="header-context">Community care impact summary</span>
      </div>
    </header>

    <div class="app-body">
      <!-- Progress Indicator (injected by ProgressIndicator component) -->
      <nav id="progress-indicator" aria-label="Progress"></nav>
      
      <!-- View container (views are rendered here) -->
      <main id="view-container" role="main"></main>
    </div>

    <footer class="app-footer" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-brand">
          <strong>Care in Action</strong>
        </div>
        <span class="footer-descriptor">Community care impact summary</span>
        <p class="footer-note">No patient information is required. Estimates are based on reported activity totals and benchmark reference rates.</p>
        <p class="footer-meta">© 2026 Care in Action · For planning and communication purposes only.</p>
      </div>
    </footer>
    
  </div>
  
  <!-- Data / Config (no calculations, no presentation) -->
  <script src="js/data.js"></script>
  <script src="js/content.js"></script>
  
  <!-- Utility functions -->
  <script src="js/utils.js"></script>
  
  <!-- Calculation service (pure functions, no DOM) -->
  <script src="js/calculator.js"></script>
  
  <!-- Shared UI components -->
  <script src="js/components/ProgressIndicator.js"></script>
  <script src="js/components/NavigationButtons.js"></script>
  <script src="js/components/EntryList.js"></script>
  
  <!-- View renderers -->
  <script src="js/views/WelcomeView.js"></script>
  <script src="js/views/ClinicInformationView.js"></script>
  <script src="js/views/ImpactMethodView.js"></script>
  <script src="js/views/ImpactActivityView.js"></script>
  <script src="js/views/ImpactSummaryView.js"></script>
  
  <!-- Export services and XLSX workbook library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="js/services/exportService.js"></script>
  
  <!-- App state + router (boots last) -->
  <script src="js/app.js"></script>

</body>
</html>
